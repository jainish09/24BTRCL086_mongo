apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatpulse-soc-app
  namespace: threatpulse
  labels:
    app: threatpulse-soc
    tier: backend-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: threatpulse-soc
  template:
    metadata:
      labels:
        app: threatpulse-soc
    spec:
      containers:
        - name: dashboard
          image: jainishhhh/mongodb_final:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: threatpulse-config
            - secretRef:
                name: threatpulse-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 12
            periodSeconds: 15
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 8
            timeoutSeconds: 3
            failureThreshold: 2
