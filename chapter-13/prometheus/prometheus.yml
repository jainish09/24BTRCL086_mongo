global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # MongoDB Percona Exporter
  - job_name: "mongodb-replica-set"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          environment: "production"
          service: "mongodb-rs0"
          cluster: "threatpulse-rs0"

  # ThreatPulse FastAPI Backend Telemetry
  - job_name: "threatpulse-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: "fastapi-backend"
          environment: "production"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

